# SPDX-License-Identifier: AGPL-3.0-or-later
# CI: architecture rules, the core with sanitizers, text keys, the web app,
# and end-to-end in the browser against the simulator (tools/ci.sh).
# Actions are pinned by commit SHA; Dependabot keeps them current.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Browser for end-to-end
        working-directory: web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: All checks
        env:
          E2E: "1"
        run: tools/ci.sh
      - name: End-to-end report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: build/e2e-*
          retention-days: 14
